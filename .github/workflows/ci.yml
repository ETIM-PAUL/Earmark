name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Key and token shapes in every committed file (no .env here, so no values).
      - run: pnpm audit:secrets
      - run: pnpm build:ts
      # Includes the Phase 16 failure drills (bot/src/drills.test.ts), end to end.
      - run: pnpm test:ts

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      # near-sdk only uses the real host functions when built by cargo-near
      # (--cfg near). A plain cargo wasm deploys, but its errors are unreadable.
      - name: Install cargo-near
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-installer.sh | sh
      - run: cargo fmt --manifest-path contracts/Cargo.toml --check
      - run: cargo clippy --manifest-path contracts/Cargo.toml --all-targets -- -D warnings
      - run: cargo near build non-reproducible-wasm --manifest-path contracts/receipts/Cargo.toml
      - name: Unit and near-workspaces sandbox tests
        run: cargo test --manifest-path contracts/Cargo.toml
        env:
          RECEIPTS_WASM: ${{ github.workspace }}/contracts/target/near/earmark_receipts/earmark_receipts.wasm
