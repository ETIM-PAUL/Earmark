name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build:ts
      - run: pnpm test:ts

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - run: cargo fmt --manifest-path contracts/Cargo.toml --check
      - run: cargo clippy --manifest-path contracts/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path contracts/Cargo.toml
      - run: cargo build --manifest-path contracts/Cargo.toml --target wasm32-unknown-unknown --release
